<div class="row w-100 shadow-none  bg-white rounded" style="align-items:end;
 border: 0px solid orange; border-radius: 15px;background-color: inherit!important; height:100px; ">
    <div class="align-items-center focusEffect center-block h-50 d-flex flex-column justify-content-center" 
        style="border-radius:999px; border:0px solid blue;align-self: flex-end; background-color: white; width:80%">
        <div class="d-flex justify-content-center align-items-center">
            <p-button icon="pi pi-plus" [style]="{'min-width':'300px'}" [raised]="true" (onClick) = "onOpenCamera()">
                <input #fileInput type="file" style="display:none" (change)="handle($event)">
            </p-button>
        </div>
        
        <!-- <p-selectButton [style]="{'font-size':'10px'}" [options]="currentOptions" formControlName="value"
            optionLabel="label" optionValue="value"></p-selectButton> -->
    </div>    
    <div style="width:20%;" class="d-flex justify-content-center align-items-end h-50">
        <p-button icon="pi pi-send" [rounded]="true" [disabled]="!addedImage" (onClick)="uploadImage()"> </p-button>
    </div>
    <!-- <img *ngIf="uploadedImageUrl" [src]="uploadedImageUrl" alt="Uploaded Image"> -->
</div>
