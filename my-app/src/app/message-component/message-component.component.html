<div class="w-100 d-flex" [class]="{'justify-content-end': subject==='dss', 'justify-content-start': subject!=='dss'}">
  <div class="message-container mx-2" [ngStyle]="style">
    <div class="message-content">
        <p class="message-text">{{ text }}</p>
    </div>
    <div class="message-icon">
        <i [class]="icon"></i>
    </div>
</div>
</div>
