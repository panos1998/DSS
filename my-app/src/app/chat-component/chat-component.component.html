<div class="row justify-content-center align-items-center vh-100">
    <div class="col-auto align-self-center">
        <p-card styleClass="">
            <ng-template pTemplate="header">
                <div class="col-12 userHeaderContainer shadow">
                    <div class="d-flex header-content">
                        <div class="d-flex title-section">
                            <h6>Decision Support System</h6>
                        </div>
                        <div class="d-flex align-items-center icon-section">
                            <i class="fa-solid fa-hospital"></i>
                            <i class="pi pi-circle-on status-icon"></i>
                        </div>
                    </div>
                </div>
            </ng-template>
            <div class="row main-row">

                <div class="col-12 thread-container-container">
                    <app-message-thread-container [messages]="messages"></app-message-thread-container>
                </div>
                <div class="col-12 d-flex align-items-end justify-content-center prompt-section">
                    <app-prompt-component (clickedOpenCamera)="receiveEvent($event)"></app-prompt-component>
                    <!-- <div [hidden] = "uploadedImageUrl.length <1">
                <img  [src]="uploadedImageUrl" alt="Uploaded Image" style="max-height: 100px; max-width: 100px;">
            </div> -->
                </div>
            </div>
        </p-card>
    </div>
</div>
